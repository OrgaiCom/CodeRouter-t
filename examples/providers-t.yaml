# ============================================================
# CodeRouter-t providers.yaml (Ollama 3-model Custom Setup)
# ============================================================

allow_paid: false
default_profile: coding

mode_aliases:
  opus: reasoning
  sonnet: coding
  haiku: general

providers:
  # ① Opus 相当モデル (思考・難問用)
  - name: ollama-opus-model
    kind: openai_compat
    base_url: http://localhost:11434/v1
    model: hf.co/ornith-ai/Ornith-1.5-35B-A3B-GGUF:latest             # ※実際に所持しているOpus用モデル名に変更してください
    paid: false
    timeout_s: 240
    output_filters: [strip_thinking]
    capabilities:
      chat: true
      streaming: true
      tools: true

  # ② Sonnet 相当モデル (メイン・標準コーディング用)
  - name: ollama-sonnet-model
    kind: openai_compat
    base_url: http://localhost:11434/v1
    model: gemma4:e4b-it-qat       # ※実際に所持しているSonnet用モデル名に変更してください
    paid: false
    timeout_s: 180
    output_filters: [strip_thinking]
    capabilities:
      chat: true
      streaming: true
      tools: true

  # ③ Haiku 相当モデル (軽量・高速用)
  - name: ollama-haiku-model
    kind: openai_compat
    base_url: http://localhost:11434/v1
    model: gemma4:e4b-it-qat        # ※実際に所持しているHaiku用モデル名に変更してください
    paid: false
    timeout_s: 60
    capabilities:
      chat: true
      streaming: true
      tools: true

profiles:
  # Opus 用プロファイル
  - name: reasoning
    providers:
      - ollama-opus-model
#      - ollama-sonnet-model

  # Sonnet 用プロファイル (デフォルト)
  - name: coding
    providers:
      - ollama-sonnet-model
#      - ollama-haiku-model

  # Haiku 用プロファイル
  - name: general
    providers:
      - ollama-haiku-model
#      - ollama-sonnet-model

# v2.16: ログフォーマット切替 — "json" (構造化) / "pretty" (INFO: ... 人間可読。規定)
# providers.yaml で切替、または env CODEROUTER_T_LOG_FORMAT / --log-format で上書き
log_format: pretty  # json | pretty

translation:
  enabled: true
  device: cpu
#  device: cuda
  log_translations: false
  verbose: true            # 新[translation]ペアは既定ON
  log_tool_calls: true     # [tool call repair]も既定ON
  max_buffer_tokens: 131072
  chunk_size_chars: 4096
  chunk_timeout_s: 10.0
  # CAT-Translate 1.4B (llama-server経由) を使う場合の例:
  backend: cat_translate
  cat_endpoint: http://127.0.0.1:8080/v1
  cat_model: CAT-Translate-1.4b
  cat_max_new_tokens: 2048
  cat_fallback_to_argos: true
